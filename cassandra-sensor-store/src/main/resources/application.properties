spring.application.name=cassandra-sensor-store
spring.threads.virtual.enabled=true
spring.cassandra.keyspace-name=sensors
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.request.timeout=20s
# TTL for reading rows. Default 30 days.
sensors.ttl-seconds=2592000
