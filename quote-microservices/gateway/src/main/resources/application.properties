spring.application.name=gateway
server.port=${HTTP_PORT:8080}
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

spring.grpc.client.channel.inventory.target=static://${INVENTORY_GRPC_HOST:localhost}:${INVENTORY_GRPC_PORT:9091}
spring.grpc.client.channel.inventory.ssl.enabled=false
spring.grpc.client.channel.pricing.target=static://${PRICING_GRPC_HOST:localhost}:${PRICING_GRPC_PORT:9092}
spring.grpc.client.channel.pricing.ssl.enabled=false
