syntax = "proto3";

package quote.v1;

option java_package = "dev.portfolio.quote.proto";
option java_multiple_files = true;

// Inventory service. Owned by inventory-service (Javalin + gRPC).
service Inventory {
  rpc CheckStock (StockRequest) returns (StockReply);
  rpc Reserve (ReserveRequest) returns (ReserveReply);
}

message StockRequest {
  string sku = 1;
  int32 quantity = 2;
}

message StockReply {
  string sku = 1;
  int32 available = 2;
  bool enough = 3;
}

message ReserveRequest {
  string sku = 1;
  int32 quantity = 2;
  string order_id = 3;
}

message ReserveReply {
  string order_id = 1;
  int32 remaining = 2;
}
