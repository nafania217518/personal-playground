spring.application.name=rabbit-task-queue
spring.threads.virtual.enabled=true

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# 1 attempt + 2 retries = 3 attempts, exponential backoff, then MessageRecoverer rejects -> DLQ
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=100ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=1s
