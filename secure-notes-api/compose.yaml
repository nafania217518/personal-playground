services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/notes
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-only-secret-change-me-please-32-bytes-min}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin-dev-password}
    depends_on:
      mongo:
        condition: service_healthy
