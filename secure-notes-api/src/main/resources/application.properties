spring.application.name=secure-notes-api
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.serialization-mode=via_dto
spring.data.mongodb.auto-index-creation=true

# Dev-only values. Override with env vars in any real deployment.
app.jwt.secret=dev-only-secret-change-me-please-32-bytes-min
app.jwt.ttl-seconds=3600
app.admin.username=admin
app.admin.password=admin-dev-password
